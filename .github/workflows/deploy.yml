name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.21.0
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm audit --prod
      - name: Audit all dependencies and report remaining development advisories
        run: |
          audit_status=0
          pnpm audit --json > audit-full.json || audit_status=$?
          if [ "$audit_status" -eq 0 ]; then
            echo 'Full dependency audit passed.'
          else
            python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('audit-full.json').read_text())
          advisories = report.get('advisories', {})
          counts = report.get('metadata', {}).get('vulnerabilities', {})
          expected_id = 'GHSA-fc5q-39xc-vjpf'
          only_expected = len(advisories) == 1 and expected_id in {
              item.get('github_advisory_id') for item in advisories.values()
          }
          advisory = next(iter(advisories.values()), {})
          findings = advisory.get('findings', [])
          development_only = bool(findings) and all(item.get('dev') is True for item in findings)
          unresolved = advisory.get('patched_versions') is None
          exactly_one_high = counts.get('high') == 1 and all(
              counts.get(level, 0) == 0 for level in ('critical', 'moderate', 'low', 'info')
          )
          if only_expected and development_only and unresolved and exactly_one_high:
              print('Known development-only picomatch advisory (GHSA-fc5q-39xc-vjpf); no patched release is published. Production audit above must remain clean.')
          else:
              print('Full dependency audit found an unapproved or newly published advisory:')
              print(json.dumps(report, indent=2))
              raise SystemExit(1)
          PY
          fi
      - name: Type check
        run: pnpm check
      - name: Tests
        run: pnpm test
      - name: Build static site
        run: pnpm build:static
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
