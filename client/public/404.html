<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f7f6f2">
  <title>404 · RIVIERA Inmobiliaria</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Manrope, Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #263248;
      background: #f7f6f2;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; }
    body {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      overflow: auto;
      margin: 0;
      padding: 24px;
      background:
        radial-gradient(ellipse at 14% 18%, rgba(61, 76, 153, .075), transparent 38%),
        radial-gradient(ellipse at 88% 84%, rgba(182, 154, 102, .095), transparent 34%),
        #f7f6f2;
    }
    main {
      width: min(100%, 620px);
      margin: auto;
      padding: clamp(34px, 7vw, 62px) clamp(24px, 8vw, 76px);
      border: 1px solid rgba(181, 164, 127, .30);
      border-radius: 14px;
      background: rgba(255, 255, 253, .90);
      box-shadow: 0 24px 80px rgba(35, 44, 69, .065);
      text-align: center;
    }
    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: 0 auto 28px;
    }
    .brand-mark { display: block; width: 54px; height: 28px; object-fit: contain; }
    .brand-copy { display: flex; flex-direction: column; align-items: center; }
    .brand-name { color: #263783; font: 500 20px/1 Georgia, "Times New Roman", serif; letter-spacing: .20em; }
    .brand-copy small { margin-top: 5px; color: #737886; font: 600 8px/1.2 Manrope, Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: .24em; }
    .brand-rule { width: 38px; height: 1px; margin: 0 auto 22px; background: #b8a272; }
    .code { display: block; width: 100%; margin: 0 auto 13px; color: #957a48; font-size: 10px; font-weight: 700; letter-spacing: .24em; line-height: 1.5; text-align: center; }
    h1 { max-width: 480px; margin: 0 auto; color: #202c43; font: 400 clamp(36px, 6.3vw, 50px)/1.08 Georgia, "Times New Roman", serif; letter-spacing: -.025em; }
    .description { max-width: 390px; margin: 16px auto 26px; color: #72798a; font-size: 13px; line-height: 1.8; }
    .home-link {
      display: inline-flex;
      min-height: 44px;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 0 19px;
      border: 1px solid #293983;
      border-radius: 7px;
      background: #293983;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .035em;
      text-decoration: none;
      transition: background .18s ease, border-color .18s ease, transform .18s ease;
    }
    .home-link:hover, .home-link:focus-visible { border-color: #1d2c6e; background: #1d2c6e; transform: translateY(-1px); }
    .home-link:focus-visible { outline: 3px solid #b8c1e3; outline-offset: 3px; }
    .home-link span:last-child { font-size: 14px; font-weight: 400; }
    html[data-theme="dark"] { color-scheme: dark; background: #111722; }
    html[data-theme="dark"] body {
      background:
        radial-gradient(ellipse at 14% 18%, rgba(91, 111, 201, .13), transparent 38%),
        radial-gradient(ellipse at 88% 84%, rgba(182, 154, 102, .09), transparent 34%),
        #111722;
    }
    html[data-theme="dark"] main { border-color: rgba(179, 164, 133, .23); background: rgba(25, 32, 46, .94); box-shadow: 0 24px 80px rgba(0, 0, 0, .24); }
    html[data-theme="dark"] .brand-name { color: #dbe1ff; }
    html[data-theme="dark"] .brand-copy small { color: #aab3c4; }
    html[data-theme="dark"] .code { color: #cfb783; }
    html[data-theme="dark"] h1 { color: #f1f2f5; }
    html[data-theme="dark"] .description { color: #b3bdce; }
    html[data-theme="dark"] .home-link { border-color: #8190d2; background: #8190d2; color: #111722; }
    html[data-theme="dark"] .home-link:hover, html[data-theme="dark"] .home-link:focus-visible { border-color: #a8b3eb; background: #a8b3eb; }
    @media (max-width: 480px) {
      body { padding: 18px; }
      main { padding: 34px 23px; border-radius: 12px; }
      .brand { margin-bottom: 24px; }
      .brand-mark { width: 48px; height: 25px; }
    }
    @media (prefers-reduced-motion: reduce) { .home-link { transition: none; } }
  </style>
</head>
<body>
  <main aria-labelledby="not-found-title">
    <div class="brand" aria-label="RIVIERA Inmobiliaria">
      <img id="brand-mark" class="brand-mark" src="./riviera-brand-mark.png" alt="">
      <span class="brand-copy"><span class="brand-name">RIVIERA</span><small>INMOBILIARIA</small></span>
    </div>
    <div class="brand-rule" aria-hidden="true"></div>
    <p class="code">ERROR 404</p>
    <h1 id="not-found-title">No encontramos esta página</h1>
    <p class="description">La dirección puede haber cambiado o no estar disponible. Volvé al inicio para seguir explorando.</p>
    <a id="home-link" class="home-link" href="/"><span>Volver al inicio</span><span aria-hidden="true">←</span></a>
  </main>
  <script>
    (function () {
      var parts = window.location.pathname.split("/").filter(Boolean);
      var isGithubProjectPage = window.location.hostname.endsWith(".github.io") && parts.length > 1;
      var base = isGithubProjectPage ? "/" + parts[0] + "/" : "/";
      document.getElementById("home-link").href = base + "#/";
      document.getElementById("brand-mark").src = base + "riviera-brand-mark.png";
      try {
        var savedTheme = localStorage.getItem("riviera-theme") || localStorage.getItem("champaqui-theme");
        if (savedTheme === "dark") document.documentElement.dataset.theme = "dark";
      } catch (_) { /* local storage may be unavailable */ }
    })();
  </script>
</body>
</html>
